name: Update Telegram Feed

on:
  schedule:
    - cron: '*/1 * * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run scraper
      run: python scraper.py

    - name: Commit changes
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com

        git add README.md

        git diff --cached --quiet || git commit -m "Update Telegram posts"

        git push
